name: Python Tests

on:
  push:
    branches: [main, develop]  
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: windows-2025
    
    steps:
    - uses: actions/checkout@v3
    
    # Python.org stopped publishing Windows installers after Python 3.11.9.
    # Use uv's managed build and the repository's exact .python-version pin.
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.13.5'

    - name: Create Python environment
      run: uv venv --seed --managed-python .venv

    - name: Verify Python version
      run: .\.venv\Scripts\python.exe python_runtime.py

    - name: Upgrade pip
      run: .\.venv\Scripts\python.exe -m pip install --upgrade "pip>=26.2.2"
        
    - name: Install dependencies
      run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

    - name: Check dependencies
      run: .\.venv\Scripts\python.exe -m pip check
        
    - name: Run tests
      run: |
        .\.venv\Scripts\python.exe -m pytest citestfiles/ -v
